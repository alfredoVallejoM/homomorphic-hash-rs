[package]
name = "homomorphic-hash-rs"
version = "0.1.0"
edition = "2021"
description = "Libreria de Hashes Homomorficos Topologicos basados en GF(2^256)"

[dependencies]
bincode = "1.3.3"
csv = "1.4.0"
purr = "0.9.0"
rand = "0.8.5"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
ureq = "2.9.1"                                         # HTTP client (Robusto, sin overhead asíncrono)
flate2 = "1.0.28"                                      # Streaming GZIP decompression
# Dependencias futuras para paralelismo o utilidades
# rayon = "1.5"

[dev-dependencies]
criterion = "0.5" # Para el perfilado termodinamico (benches)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
target-cpu = "native" # Vital para vectorizacion AVX2 / PCLMULQDQ

[features]
default = []
# Enable this feature to compile the library without conditional branches
# in hot loops, preventing timing side-channel attacks at the cost of
# some structural throughput.
crypto_mode = []

[[bench]]
name = "01_throughput"
harness = false

[[bench]]
name = "02_asymptotic"
harness = false

[[bench]]
name = "03_thermodynamic"
harness = false
