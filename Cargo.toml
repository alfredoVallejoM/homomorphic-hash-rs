[package]
name = "homomorphic-hash-rs"
version = "0.1.0"
edition = "2021"
description = "Firmas algebraicas homomorficas no criptograficas sobre campos finitos"
autobenches = false

[workspace]
members = [
    "crates/microfield",
    "crates/structural-field-fixture",
    "crates/validation-lab",
]
exclude = ["crates/microfield/test-fixtures/external-consumer"]
default-members = ["crates/microfield"]
resolver = "2"

[dependencies]
bincode = "1.3.3"
csv = "1.4.0"
purr = "0.9.0"
rand = "0.8.5"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
ureq = "2.9.1"                                         # HTTP client (Robusto, sin overhead asíncrono)
flate2 = "1.0.28"                                      # Streaming GZIP decompression
microfield = { path = "crates/microfield" }
sha2 = "0.10.9"
# Dependencias futuras para paralelismo o utilidades
# rayon = "1.5"

[dev-dependencies]
allocation-counter = "0.8.1"
criterion = "0.5" # Para el perfilado termodinamico (benches)
serde_json = "1.0"
structural-field-fixture = { path = "crates/structural-field-fixture" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `target-cpu` se configura mediante RUSTFLAGS en mediciones controladas.

[features]
default = []
dynamic-fields = ["microfield/dynamic"]
# Compatibilidad fuente con el prototipo. No implica garantías criptográficas
# ni de tiempo constante.
crypto_mode = []

[[bench]]
name = "structural_signatures"
path = "benches/structural_signatures.rs"
harness = false

[[bench]]
name = "fast_graph"
path = "benches/fast_graph.rs"
harness = false
