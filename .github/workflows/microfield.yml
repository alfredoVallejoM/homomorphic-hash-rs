name: Microfield

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microfield-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: Stable quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Format external generated-field fixture
        run: cargo +stable fmt --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml -- --check
      - name: Test all Microfield targets
        run: cargo +stable test -p microfield --features generator --all-targets
      - name: Zero-allocation batch contract
        run: cargo +stable test -p microfield --all-features --test batch_allocations
      - name: Clippy
        run: cargo +stable clippy -p microfield --all-features --all-targets -- -D warnings
      - name: Audit versioned calibration decisions
        run: bash crates/microfield/tools/audit_calibration.sh
      - name: Exercise calibration gate rejection paths
        run: bash crates/microfield/tools/test_calibration_gate.sh
      - name: Audit confined unsafe inventory
        run: bash crates/microfield/tools/audit_unsafe_scope.sh
      - name: Audit x86-64 PCLMUL assembly
        run: bash crates/microfield/tools/audit_x86_pclmul.sh
      - name: Audit x86-64 VPCLMUL assembly
        run: bash crates/microfield/tools/audit_x86_vpclmul.sh
      - name: Audit x86-64 prime-field assembly
        run: bash crates/microfield/tools/audit_x86_prime.sh
      - name: Install AArch64 target for PMULL assembly audit
        run: rustup +stable target add aarch64-unknown-linux-gnu
      - name: Audit AArch64 PMULL assembly
        run: bash crates/microfield/tools/audit_aarch64_pmull.sh
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc -p microfield --all-features --no-deps
      - name: Compile-fail documentation contracts
        run: cargo +stable test -p microfield --all-features --doc
      - name: External generated-field consumer
        run: cargo +stable test --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml --all-targets
      - name: External compile-fail contracts
        run: cargo +stable test --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml --doc
      - name: External generated-source Clippy
        run: cargo +stable clippy --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml --all-targets -- -D warnings
      - name: Legacy library regression
        run: cargo +stable test -p algesum --features legacy --lib
      - name: Legacy field compatibility
        run: cargo +stable test -p algesum --features legacy --test microfield_compat
      - name: F6.V validation harness unit gates
        run: cargo +stable test -p microfield-validation-lab --all-targets

  root-quality:
    name: Root workspace quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Compile every workspace target from Cargo.lock
        run: cargo +stable test --workspace --all-features --all-targets --locked --no-run
      - name: Workspace Clippy
        run: cargo +stable clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Workspace Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --locked --no-deps

  signatures-rc:
    name: Signatures and protocols RC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Homomorphic signatures, deltas, trees, DB and reconciliation
        run: >-
          cargo +stable test -p algesum --all-features --locked
          --test structural_signatures
          --test rc_supported_surface
          --test rc_signature_api
          --test rc_delta_api
          --test rc_summary_tree
          --test rc_database_reconciliation

  graphs-rc:
    name: Graph pipeline and exact DAG RC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Fast filters, exact canonization, deltas and DAG
        run: >-
          cargo +stable test -p algesum --all-features --locked
          --test fast_graph
          --test graph_canonical
          --test microcanon
          --test graph_signatures_v2
          --test graph_g12
          --test graph_g13_g14
          --test rc_graph_dag

  rc7-properties:
    name: RC.7 property and model contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Finite-field laws and reference arithmetic
        run: >-
          cargo +stable test -p microfield --all-features --locked
          --test property_fields
      - name: Executable correctness inventory and state-machine properties
        run: >-
          cargo +stable test -p algesum --all-features --locked
          --test rc_correctness_inventory
          --test rc_property_contracts
          --test rc_graph_properties

  rc7-fuzz-smoke:
    name: RC.7 fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Compile every locked fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
      - name: Regenerate deterministic valid seeds
        run: cargo run --manifest-path fuzz/Cargo.toml --bin generate_seed_corpus --locked
      - name: Verify seed corpus is reproducible
        run: git diff --exit-code -- fuzz/corpus
      - name: Prepare disposable fuzz corpora
        shell: bash
        run: |
          set -euo pipefail
          for target in microfield_manifests structural_wires graph_wires; do
            mkdir -p "$RUNNER_TEMP/rc7-corpus/$target"
            cp -a "fuzz/corpus/$target/." "$RUNNER_TEMP/rc7-corpus/$target/"
          done
      - name: Fuzz manifests
        run: >-
          cargo +nightly fuzz run microfield_manifests
          "$RUNNER_TEMP/rc7-corpus/microfield_manifests"
          -- -runs=5000 -max_len=65536 -timeout=10
      - name: Fuzz structural, delta and database wires
        run: >-
          cargo +nightly fuzz run structural_wires
          "$RUNNER_TEMP/rc7-corpus/structural_wires"
          -- -runs=5000 -max_len=4096 -timeout=10
      - name: Fuzz exact graph and DAG wires
        run: >-
          cargo +nightly fuzz run graph_wires
          "$RUNNER_TEMP/rc7-corpus/graph_wires"
          -- -runs=5000 -max_len=4096 -timeout=10

  f6-validation:
    name: F6.V reproducibility (${{ matrix.arch }})
    needs: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Regenerate deterministic F6.V semantic evidence
        run: >-
          cargo +stable run --release -p microfield-validation-lab -- semantic
          --manifest validation/f6/manifest.json
          --out validation/f6/results/semantic-v1.json
      - name: Verify semantic report is reproducible
        run: git diff --exit-code -- validation/f6/results
      - name: Capture host-specific performance evidence
        run: >-
          cargo +stable run --release -p microfield-validation-lab -- performance
          --manifest validation/f6/manifest.json
          --out f6-performance-${{ matrix.arch }}.json
      - name: Upload F6.V performance evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: f6-performance-${{ matrix.arch }}
          path: f6-performance-${{ matrix.arch }}.json
          if-no-files-found: error

  rc8-capacity:
    name: RC.8 capacity and regression (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run frozen RC.8 capacity campaign
        run: >-
          cargo +stable run --release -p microfield-validation-lab --bin f6-validation
          --locked -- rc8-capacity
          --manifest validation/rc/capacity-manifest-v1.json
          --out rc8-capacity-candidate-${{ matrix.arch }}.json
      - name: Check out pull-request baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: rc8-baseline
      - name: Detect an RC.8-aware baseline
        if: github.event_name == 'pull_request'
        id: baseline-support
        shell: bash
        run: |
          if test -f rc8-baseline/validation/rc/capacity-manifest-v1.json && \
             grep -q 'rc8-compare' rc8-baseline/crates/validation-lab/src/main.rs; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'The target branch predates RC.8; this run bootstraps the baseline.'
          fi
      - name: Measure the pull-request baseline on the same runner
        if: github.event_name == 'pull_request' && steps.baseline-support.outputs.available == 'true'
        working-directory: rc8-baseline
        run: >-
          cargo +stable run --release -p microfield-validation-lab --bin f6-validation
          --locked -- rc8-capacity
          --manifest validation/rc/capacity-manifest-v1.json
          --out ../rc8-capacity-baseline-${{ matrix.arch }}.json
      - name: Enforce the frozen-route regression threshold
        if: github.event_name == 'pull_request' && steps.baseline-support.outputs.available == 'true'
        run: >-
          cargo +stable run --release -p microfield-validation-lab --bin f6-validation
          --locked -- rc8-compare
          --manifest validation/rc/capacity-manifest-v1.json
          --baseline rc8-capacity-baseline-${{ matrix.arch }}.json
          --candidate rc8-capacity-candidate-${{ matrix.arch }}.json
          --out rc8-regression-${{ matrix.arch }}.json
      - name: Upload RC.8 capacity evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rc8-capacity-${{ matrix.arch }}
          path: |
            rc8-capacity-candidate-${{ matrix.arch }}.json
            rc8-capacity-baseline-${{ matrix.arch }}.json
            rc8-regression-${{ matrix.arch }}.json
          if-no-files-found: error

  publication-benchmark-smoke:
    name: Pre-RC publication harness smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Execute isolated-process benchmark smoke
        run: >-
          cargo +stable run --release -p microfield-validation-lab --locked --
          publication-campaign
          --manifest validation/benchmarks/manifests/smoke-v1.json
          --run-dir "${{ runner.temp }}/publication-smoke-${{ matrix.arch }}"
      - name: Validate smoke classification and complete inventory
        run: >-
          jq -e
          '.environment_classification == "smoke" and
          .claims_allowed == false and
          (.cells | length) == 21'
          "${{ runner.temp }}/publication-smoke-${{ matrix.arch }}/aggregate.json"
      - name: Verify analysis regenerates byte-identical artifacts
        shell: bash
        run: |
          set -euo pipefail
          run_dir="${{ runner.temp }}/publication-smoke-${{ matrix.arch }}"
          cp "$run_dir/checksums.txt" "$run_dir/checksums.before"
          cargo +stable run --release -p microfield-validation-lab --locked -- \
            publication-analyse \
            --manifest validation/benchmarks/manifests/smoke-v1.json \
            --run-dir "$run_dir"
          diff -u "$run_dir/checksums.before" "$run_dir/checksums.txt"
          test "$(wc -l < "$run_dir/raw/workers.jsonl")" -eq 42
      - name: Upload non-publicable smoke artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publication-benchmark-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/publication-smoke-${{ matrix.arch }}
          if-no-files-found: error

  rc9-consumer:
    name: RC.9 external consumer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Format the independent consumer
        run: >-
          cargo +stable fmt --manifest-path test-fixtures/rc-consumer/Cargo.toml
          -- --check
      - name: Compile and test persist/restart/rebuild contracts
        run: >-
          cargo +stable test --manifest-path test-fixtures/rc-consumer/Cargo.toml
          --all-targets --locked
      - name: External consumer Clippy
        run: >-
          cargo +stable clippy --manifest-path test-fixtures/rc-consumer/Cargo.toml
          --all-targets --locked -- -D warnings
      - name: Execute the clean end-to-end consumer
        run: >-
          cargo +stable run --manifest-path test-fixtures/rc-consumer/Cargo.toml
          --locked -- rc9-consumer-${{ matrix.arch }}
      - name: Audit dependency and package boundary
        if: matrix.arch == 'x86_64'
        run: bash tools/audit_rc_package.sh
      - name: Upload persisted RC.9 artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rc9-consumer-${{ matrix.arch }}
          path: rc9-consumer-${{ matrix.arch }}
          if-no-files-found: error

  rc10-decision:
    name: RC.10 reproducible go-no-go
    needs:
      - stable
      - root-quality
      - signatures-rc
      - graphs-rc
      - rc7-properties
      - rc7-fuzz-smoke
      - rc8-capacity
      - publication-benchmark-smoke
      - rc9-consumer
      - f6-validation
      - features
      - msrv
      - generated
      - miri
      - x86-asan
      - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Download x86-64 capacity evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: rc8-capacity-x86_64
          path: ${{ runner.temp }}/rc10-evidence/rc8-x86_64
      - name: Download AArch64 capacity evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: rc8-capacity-aarch64
          path: ${{ runner.temp }}/rc10-evidence/rc8-aarch64
      - name: Download x86-64 consumer evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: rc9-consumer-x86_64
          path: ${{ runner.temp }}/rc10-evidence/rc9-x86_64
      - name: Download AArch64 consumer evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: rc9-consumer-aarch64
          path: ${{ runner.temp }}/rc10-evidence/rc9-aarch64
      - name: Assemble the machine-readable RC decision
        run: >-
          cargo +stable run -p microfield-validation-lab --bin f6-validation --locked --
          rc10-decision --manifest validation/rc/decision-manifest-v1.json
          --capacity-report "${{ runner.temp }}/rc10-evidence/rc8-x86_64/rc8-capacity-candidate-x86_64.json"
          --capacity-report "${{ runner.temp }}/rc10-evidence/rc8-aarch64/rc8-capacity-candidate-aarch64.json"
          --consumer-report "${{ runner.temp }}/rc10-evidence/rc9-x86_64/rc9-report.json"
          --consumer-report "${{ runner.temp }}/rc10-evidence/rc9-aarch64/rc9-report.json"
          --required-ci-gates-passed
          --out rc10-decision.json
      - name: Require ReadyForInternalUse
        run: jq -e '.final_decision == "ReadyForInternalUse"' rc10-decision.json
      - name: Upload RC.10 decision artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rc10-decision
          path: rc10-decision.json
          if-no-files-found: error

  features:
    name: Runtime feature matrix
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install AArch64 target
        run: rustup +stable target add aarch64-unknown-linux-gnu
      - run: cargo +stable check -p microfield --no-default-features
      - run: cargo +stable check -p microfield --no-default-features --features builtin-fields
      - run: cargo +stable check -p microfield --no-default-features --features portable
      - run: cargo +stable check -p microfield --no-default-features --features portable,builtin-fields
      - run: cargo +stable check -p microfield --no-default-features --features prime-fields
      - run: cargo +stable check -p microfield --no-default-features --features portable,prime-fields
      - run: cargo +stable check -p microfield --no-default-features --features alloc,portable,builtin-fields
      - run: cargo +stable check -p microfield --no-default-features --features alloc,portable,prime-fields
      - name: no_std unit tests with binary and prime fields
        run: >-
          cargo +stable test -p microfield --no-default-features
          --features alloc,portable,builtin-fields,prime-fields --lib
      - run: cargo +stable check -p microfield --no-default-features --features std,portable
      - run: cargo +stable check -p microfield --no-default-features --features generator
      - run: cargo +stable check -p microfield --target aarch64-unknown-linux-gnu --no-default-features --features portable
      - run: cargo +stable check -p microfield --target aarch64-unknown-linux-gnu --no-default-features --features portable,builtin-fields
      - run: cargo +stable check -p microfield --target aarch64-unknown-linux-gnu --no-default-features --features portable,prime-fields
      - run: cargo +stable check -p microfield --target aarch64-unknown-linux-gnu --no-default-features --features std,portable,builtin-fields
      - name: External ABI 3 scalar-only no_std
        run: cargo +stable check --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml --no-default-features --lib
      - name: Root package feature boundaries
        run: |
          cargo +stable check -p algesum --no-default-features --locked
          cargo +stable check -p algesum --no-default-features --features signatures --locked
          cargo +stable check -p algesum --no-default-features --features dynamic-signatures --locked
          cargo +stable check -p algesum --no-default-features --features graph --locked
          cargo +stable check -p algesum --no-default-features --features legacy --locked
      - name: Signatures and protocols without graph or legacy
        run: >-
          cargo +stable test -p algesum --no-default-features
          --features signatures --locked
          --test rc_supported_surface
          --test rc_property_contracts
          --test rc_signature_api
          --test rc_delta_api
          --test rc_summary_tree
          --test rc_database_reconciliation
      - name: Runtime signatures without graph or legacy
        run: >-
          cargo +stable test -p algesum --no-default-features
          --features dynamic-signatures --locked
          --test rc_supported_surface
          --test rc_signature_api

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install MSRV
        run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check -p microfield --no-default-features
      - run: cargo +1.89.0 test -p microfield --features generator --all-targets
      - run: cargo +1.89.0 test --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml --lib
      - run: cargo +1.89.0 check --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml --no-default-features --lib

  generated:
    name: Generated artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify deterministic artifact sets and external prime profiles
        shell: bash
        run: |
          set -euo pipefail
          for manifest in crates/microfield/fields/*.toml; do
            if grep -q '^prime_schema_version[[:space:]]*=' "$manifest"; then
              cargo +stable run -q -p microfield --features generator \
                --bin microfield-gen -- prime-validate "$manifest"
            else
              cargo +stable run -q -p microfield --features generator \
                --bin microfield-gen -- check "$manifest" \
                --out crates/microfield/artifacts
            fi
          done
      - name: Replay maintained prime certificates
        run: >-
          cargo +stable run -q -p microfield --features generator
          --bin microfield-gen -- verify-primes --json

  miri:
    name: Miri runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p microfield --no-default-features --features portable,builtin-fields
      - name: Miri owned aligned storage
        run: >-
          cargo +nightly miri test -p microfield --no-default-features
          --features alloc,portable,builtin-fields --lib --test packed_batch
      - name: Miri generated optimizer paths
        run: cargo +nightly miri test --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml --lib
      - name: Miri H2.8 differential and ABI contracts
        run: >-
          cargo +nightly miri test -p microfield --no-default-features
          --features generator,portable,builtin-fields
          --test differential_corpus --test runtime_codegen_stability
      - name: Miri Phase 4 portable prime fields
        run: >-
          cargo +nightly miri test -p microfield --no-default-features
          --features portable,prime-fields --test prime_fields

  x86-asan:
    name: x86-64 PCLMUL/VPCLMUL AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install nightly Rust with sources
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Test audited x86 binary and prime boundaries under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0
        run: >-
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p microfield --all-features --test x86_pclmul --test x86_vpclmul
          --test x86_prime --test external_prime_bmi2_bridge
          --test external_prime_avx2_bridge
          --test prime_fields --test prime_artifacts
          --test packed_batch --test packed_views --test differential_corpus
          --test phase3_algorithms
      - name: Test generic BMI2 limb shapes under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0
        run: >-
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p microfield --all-features --lib
          backend::x86_prime::tests::bmi2_product_builder_covers_64_128_192_and_256_bit_shapes
      - name: External profile PCLMUL AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0
        run: >-
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml
          --lib

  arm64:
    name: AArch64 PMULL hardware gates
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Differential PMULL suite on hardware
        run: >-
          cargo +stable test -p microfield --all-features --test aarch64_pmull
          --test packed_batch --test packed_views --test differential_corpus
          --test phase3_algorithms --test prime_fields --test prime_artifacts
      - name: Generated external profiles on PMULL
        run: cargo +stable test --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml --lib
      - name: Zero-allocation PMULL gate
        run: cargo +stable test -p microfield --all-features --test batch_allocations
      - name: AArch64 Clippy
        run: cargo +stable clippy -p microfield --all-features --all-targets -- -D warnings
      - name: Audit native PMULL assembly
        run: bash crates/microfield/tools/audit_aarch64_pmull.sh
      - name: Build benchmark harness on real hardware
        run: >-
          cargo +stable bench -p microfield --bench portable_batch
          --bench derived_algorithms --bench prime_fields --no-run
      - name: Install nightly Rust with sources
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: PMULL AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0
        run: >-
          cargo +nightly test -Zbuild-std --target aarch64-unknown-linux-gnu
          -p microfield --no-default-features --features std,portable,builtin-fields,prime-fields
          --test aarch64_pmull --test packed_batch --test packed_views
          --test differential_corpus --test phase3_algorithms --test prime_fields
      - name: External profile PMULL AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0
        run: >-
          cargo +nightly test -Zbuild-std --target aarch64-unknown-linux-gnu
          --manifest-path crates/microfield/test-fixtures/external-consumer/Cargo.toml
          --lib

  required-gates:
    name: Required gates
    if: ${{ always() }}
    needs:
      - stable
      - root-quality
      - signatures-rc
      - graphs-rc
      - rc7-properties
      - rc7-fuzz-smoke
      - rc8-capacity
      - publication-benchmark-smoke
      - rc9-consumer
      - rc10-decision
      - f6-validation
      - features
      - msrv
      - generated
      - miri
      - x86-asan
      - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STABLE: ${{ needs.stable.result }}
      ROOT_QUALITY: ${{ needs.root-quality.result }}
      SIGNATURES_RC: ${{ needs.signatures-rc.result }}
      GRAPHS_RC: ${{ needs.graphs-rc.result }}
      RC7_PROPERTIES: ${{ needs.rc7-properties.result }}
      RC7_FUZZ_SMOKE: ${{ needs.rc7-fuzz-smoke.result }}
      RC8_CAPACITY: ${{ needs.rc8-capacity.result }}
      PUBLICATION_BENCHMARK_SMOKE: ${{ needs.publication-benchmark-smoke.result }}
      RC9_CONSUMER: ${{ needs.rc9-consumer.result }}
      RC10_DECISION: ${{ needs.rc10-decision.result }}
      F6_VALIDATION: ${{ needs.f6-validation.result }}
      FEATURES: ${{ needs.features.result }}
      MSRV: ${{ needs.msrv.result }}
      GENERATED: ${{ needs.generated.result }}
      MIRI: ${{ needs.miri.result }}
      X86_ASAN: ${{ needs.x86-asan.result }}
      ARM64: ${{ needs.arm64.result }}
    steps:
      - name: Require every semantic, portable and ISA gate
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$STABLE" "$ROOT_QUALITY" "$SIGNATURES_RC" "$GRAPHS_RC" \
            "$RC7_PROPERTIES" "$RC7_FUZZ_SMOKE" "$RC8_CAPACITY" \
            "$PUBLICATION_BENCHMARK_SMOKE" \
            "$RC9_CONSUMER" "$RC10_DECISION" \
            "$F6_VALIDATION" "$FEATURES" "$MSRV" "$GENERATED" "$MIRI" \
            "$X86_ASAN" "$ARM64"; do
            test "$result" = success
          done
