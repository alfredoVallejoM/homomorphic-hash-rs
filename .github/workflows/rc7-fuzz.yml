name: RC.7 sustained fuzzing

on:
  schedule:
    - cron: "31 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc7-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sustained-fuzz:
    name: Sustained fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: microfield_manifests
            max_len: 65536
          - target: structural_wires
            max_len: 4096
          - target: graph_wires
            max_len: 4096
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Prepare disposable corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc7-corpus/${{ matrix.target }}"
          cp -a "fuzz/corpus/${{ matrix.target }}/." \
            "$RUNNER_TEMP/rc7-corpus/${{ matrix.target }}/"
      - name: Run fifteen-minute ASan campaign
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }}
          "$RUNNER_TEMP/rc7-corpus/${{ matrix.target }}"
          -- -max_total_time=900 -max_len=${{ matrix.max_len }} -timeout=10
      - name: Upload crashing inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rc7-fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
