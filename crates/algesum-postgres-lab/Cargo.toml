[package]
name = "algesum-postgres-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Reproducible PostgreSQL integration and scaling laboratory for Algesum"

[dependencies]
algesum = { path = "../..", default-features = false, features = ["signatures"] }
microfield = { path = "../microfield" }
postgres = "0.19.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
