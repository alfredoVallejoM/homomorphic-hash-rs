[package]
name = "algesum-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
microfield = { path = "../crates/microfield", features = ["generator", "dynamic"] }
algesum = { path = "..", features = ["dynamic-fields"] }

[[bin]]
name = "microfield_manifests"
path = "fuzz_targets/microfield_manifests.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structural_wires"
path = "fuzz_targets/structural_wires.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_wires"
path = "fuzz_targets/graph_wires.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
